<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dylan's Stars</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stars">
<meta name="theme-color" content="#FFF3C4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3C4; --dot:#FFE08A; --ink:#1B1F3B; --card:#FFFFFF; --muted:#5A5F7A; --edge:#1B1F3B; --soft:#EFE6C6;
  --blue:#2F6BFF; --green:#16A34A; --red:#EF4444; --purple:#7C3AED; --pink:#FF3D9A; --orange:#FF8A00; --teal:#0EA5A4; --gold:#FFC21A;
  --green-ink:#15803D; --red-ink:#DC2626; --gold-soft:#FFF1B8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A33; --dot:#1E2650; --ink:#F3F4FF; --card:#1F2750; --muted:#A9B0D6; --edge:#070A18; --soft:#2A3366;
    --green-ink:#4ADE80; --red-ink:#FF8080; --gold-soft:#4A3A08;
  }
}
:root[data-theme="dark"]{
  --bg:#141A33; --dot:#1E2650; --ink:#F3F4FF; --card:#1F2750; --muted:#A9B0D6; --edge:#070A18; --soft:#2A3366;
  --green-ink:#4ADE80; --red-ink:#FF8080; --gold-soft:#4A3A08;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* No zooming, no text-selection popups, no rubber-band weirdness */
html{touch-action:manipulation;height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);overscroll-behavior:none;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 2.2px);background-size:22px 22px;
  font-family:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,.codebox{-webkit-user-select:text;user-select:text}
img,svg{-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 28px;min-height:100%}

/* chunky sticker style, same as Phonics */
.big,.go,.ghost,.chip,.row,.rcard,.ccard{border:3px solid var(--edge)}
.big,.go,.ghost{box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.big:active:not(:disabled),.go:active:not(:disabled),.ghost:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.chip{box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.go{width:100%;border-radius:18px;padding:18px;font-size:1.35rem;font-weight:700;color:#fff;background:var(--green)}
.go:disabled{opacity:.45}
.ghost{width:100%;background:var(--card);border-radius:18px;padding:16px;font-size:1.15rem;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.title{font-size:clamp(1.9rem,8.6vw,2.6rem);line-height:1.05;margin:16px 0 4px;font-weight:700}
.hint{color:var(--muted);font-size:1rem;line-height:1.5;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{background:none;border:0;font-size:1.1rem;padding:10px 4px;color:var(--ink);font-weight:700}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;font-size:1rem}
.ghead{font-size:1.15rem;margin:30px 0 10px;font-weight:700}
.warn{color:var(--red-ink);font-size:.98rem;margin-top:10px;text-align:center;min-height:1.3em}
.inp{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;border-radius:12px;border:3px solid var(--edge);background:var(--card);color:var(--ink);min-width:0}
.inp:focus{outline:3px solid var(--blue);outline-offset:1px}

/* Logo */
.logo{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--edge);margin:8px 0 16px;height:190px;display:grid;place-items:center}
.lg-bg{position:absolute;inset:0;width:100%;height:100%}
.lg-bg .tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.lg-txt{position:relative;text-align:center;z-index:2;margin-top:-10px}
.lg-dy,.lg-st{font-weight:700;line-height:1;--o:#1B1F3B;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 6px 0 var(--o)}
.lg-dy{font-size:2rem;transform:rotate(-5deg);display:inline-block;margin-bottom:2px}
.lg-st{font-size:clamp(3.2rem,17vw,4.6rem);letter-spacing:.03em}
.lg-st span,.lg-dy span{display:inline-block}
.lg-st span:nth-child(odd){transform:translateY(-3px) rotate(-4deg)} .lg-st span:nth-child(even){transform:translateY(2px) rotate(4deg)}
.lg-pr{display:inline-block;margin-top:8px;background:#FF3D9A;color:#fff;font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 14px;border:3px solid #1B1F3B;border-radius:10px;box-shadow:0 3px 0 #1B1F3B;transform:rotate(2deg)}
.lg-m{position:absolute;z-index:1;width:92px;left:-10px;bottom:-16px;animation:lgbob 3s ease-in-out infinite}
.lg-m2{position:absolute;z-index:1;width:46px;right:12px;top:12px;animation:lgspin 6s ease-in-out infinite}
@keyframes lgbob{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-7px)}}
@keyframes lgspin{0%,100%{transform:rotate(10deg) scale(1)}50%{transform:rotate(-12deg) scale(1.1)}}

/* Count card */
.ccard{background:var(--card);border-radius:26px;box-shadow:0 6px 0 var(--edge);padding:16px 18px 18px;position:relative;overflow:hidden}
.ctop{display:flex;align-items:center;justify-content:center;gap:18px}
.cm{width:96px;flex:none;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.cnum{font-size:4.6rem;font-weight:700;line-height:.9;color:var(--gold);--o:#1B1F3B;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 6px 0 var(--o)}
.clab{font-size:1.3rem;font-weight:700;margin-top:8px}
.cnum.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.6)}100%{transform:scale(1)}}
.pbar{height:18px;background:var(--soft);border:3px solid var(--edge);border-radius:12px;overflow:hidden;margin:16px 0 8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD23F,var(--orange),var(--pink));border-radius:0 8px 8px 0;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.cnext{font-size:1.05rem;line-height:1.35}
.cnext b{font-weight:700}
.cdone{margin-top:14px}

/* Give / take */
.gt{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin:22px 0 4px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:24px;padding:14px 8px 16px;color:#fff;font-weight:700;min-height:132px}
.big .bi{font-size:2.6rem;line-height:1.1}
.big .bl{font-size:1.3rem}
.big.give{background:var(--green)}
.big.take{background:var(--red)}
.big:disabled{opacity:.4;box-shadow:0 2px 0 var(--edge);transform:translateY(3px)}
.bi svg{width:56px;height:56px;display:block}

/* Reward trail */
.trail{position:relative;margin-top:6px}
.trail::before{content:"";position:absolute;left:31px;top:24px;bottom:24px;border-left:4px dashed var(--muted);opacity:.5}
.rcard{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 12px 10px 10px;margin:12px 0;box-shadow:0 3px 0 var(--edge)}
.rnode{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--edge);display:grid;place-items:center;font-weight:700;font-size:1.05rem;background:var(--soft)}
.remo{flex:none;font-size:2rem;width:40px;text-align:center}
.rtxt{flex:1;min-width:0}
.rtxt h4{margin:0;font-size:1.1rem;line-height:1.25}
.rtxt p{margin:2px 0 0;font-size:.92rem;color:var(--muted)}
.rcard.next{border-color:var(--orange);box-shadow:0 3px 0 var(--orange)}
.rcard.next .rnode{background:var(--orange);color:#fff}
.rcard.ready{background:linear-gradient(160deg,#FFF6C8,#FFCF3F);animation:glow 1.8s ease-in-out infinite}
.rcard.ready h4,.rcard.ready p{color:#3A2A00}
.rcard.ready .rnode{background:var(--gold);color:#1B1F3B}
@keyframes glow{0%,100%{box-shadow:0 3px 0 var(--edge)}50%{box-shadow:0 3px 0 var(--edge),0 0 0 6px rgba(255,194,26,.45)}}
.rcard.given{opacity:.7;box-shadow:none}
.rcard.given .rnode{background:var(--green);color:#fff}
.rcard.locked .remo{filter:grayscale(.8);opacity:.55}
.rbtn{flex:none;border:3px solid #1B1F3B;background:var(--green);color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;font-size:.95rem;box-shadow:0 3px 0 #1B1F3B}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #1B1F3B}

.foot{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.syncline{text-align:center;color:var(--muted);font-size:.92rem;margin-top:14px;min-height:1.2em}

/* Undo toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastin .3s cubic-bezier(.2,1.3,.4,1);max-width:calc(100% - 32px);white-space:nowrap}
.toast button{border:0;background:var(--gold);color:#1B1F3B;border-radius:10px;padding:8px 14px;font-weight:700}
@keyframes toastin{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* Sheets and popups */
.pop-bg{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;z-index:20;padding:20px;animation:fadein .2s ease}
.pop-bg.sheet-bg{place-items:end center;padding:0}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pop{background:var(--card);border:4px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);padding:24px 20px;text-align:center;max-width:340px;width:100%;animation:popin .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pop h2{margin:4px 0 8px;font-size:1.6rem}
.pop p{color:var(--muted);margin:0 0 18px;font-size:1.05rem;line-height:1.4}
.pk{font-weight:700;color:var(--orange);font-size:1rem}
.sheet{width:100%;max-width:560px;background:var(--card);border:4px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sheetin .32s cubic-bezier(.2,1.2,.4,1);max-height:88vh;overflow:auto}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{margin:0 0 14px;font-size:1.5rem;text-align:center}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:12px 12px;font-size:1.05rem;font-weight:700;text-align:left;line-height:1.2}
.chip .ce{font-size:1.5rem;flex:none}
.sheet.good .chip{background:#E7F8EC;color:#14532D}
.sheet.bad .chip{background:#FFE7E7;color:#7F1D1D}
.gate .disp{font-size:2.2rem;font-weight:700;min-height:3.2rem;line-height:1.3;border:3px solid var(--edge);border-radius:14px;margin:6px 0 14px;background:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{font-size:1.45rem;font-weight:700;padding:12px 0;border:3px solid var(--edge);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--edge)}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.keys .ok{background:var(--green);color:#fff}
.gate.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.egrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}
.egrid button{font-size:1.8rem;padding:6px 0;border:3px solid var(--edge);border-radius:12px;background:var(--bg)}
.pop-bg.kb{place-items:start center;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.inp.ekb{font-size:2.6rem;text-align:center;padding:8px;caret-color:var(--blue)}
.ekbh{font-size:.95rem;margin:10px 0 0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

/* Grown-ups */
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:8px;margin:10px 0;box-shadow:0 3px 0 var(--edge)}
.ebtn{flex:none;width:48px;height:48px;font-size:1.7rem;border:3px solid var(--edge);border-radius:12px;background:var(--bg);padding:0}
.row{flex-wrap:wrap}
.row .inp{flex:1 1 0;width:auto}
.mstep{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px 56px;color:var(--muted);font-weight:700;font-size:.95rem}
.step{flex:none;display:flex;align-items:center;gap:6px}
.step button{width:42px;height:40px;border:3px solid var(--edge);border-radius:10px;background:var(--bg);font-size:1.2rem;font-weight:700;padding:0}
.step b{min-width:34px;text-align:center;font-size:1.15rem}
.step small{display:block;font-size:.65rem;color:var(--muted);font-weight:700;line-height:1}
.handle{flex:none;width:36px;align-self:stretch;display:grid;place-items:center;touch-action:none;cursor:grab;margin:-8px -8px -8px -8px;padding:8px 0}
.handle svg{width:12px;height:20px;fill:var(--muted)}
.row.dragging{position:relative;z-index:6;box-shadow:0 12px 24px rgba(10,14,40,.3);cursor:grabbing}
.row.dragging .handle svg{fill:var(--ink)}
.del{flex:none;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:1.3rem;border-radius:10px}
.addbtn{width:100%;border:3px dashed var(--edge);background:transparent;border-radius:16px;padding:12px;font-weight:700;font-size:1.05rem;margin-top:4px}
.sw-row{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;padding:14px 16px;text-align:left;
  background:var(--card);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.sw-ic{font-size:1.5rem;width:30px;text-align:center;flex:none}
.sw-lb{flex:1;font-size:1.1rem;font-weight:700;line-height:1.25}
.sw-lb small{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.sw-track{flex:none;position:relative;width:64px;height:36px;border-radius:999px;background:var(--soft);border:3px solid var(--edge);transition:background .2s}
.sw-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--edge);transition:transform .2s}
.sw-row[aria-checked="true"] .sw-track{background:var(--green)}
.sw-row[aria-checked="true"] .sw-knob{transform:translateX(28px)}
.pill{flex:none;font-size:.95rem;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--edge);background:var(--soft)}
.pill[data-s="ok"],.pill[data-s="idle"]{background:var(--green);color:#fff}
.pill[data-s="error"]{background:var(--orange);color:#fff}
.codebox{margin-top:22px;text-align:center;white-space:nowrap;font-size:clamp(1.4rem,7.4vw,2.4rem);font-weight:700;letter-spacing:.06em;
  background:var(--card);border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:18px 10px}
.danger{color:var(--red-ink)}

/* History */
.hday{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem;font-weight:700;margin:24px 0 8px}
.hday span:last-child{font-size:.95rem;color:var(--muted)}
.hrow{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--edge);border-radius:14px;padding:8px 10px;margin:8px 0}
.hd{flex:none;width:44px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;border:2px solid var(--edge)}
.hd.p{background:var(--green)} .hd.m{background:var(--red)}
.ht{flex:1;min-width:0;line-height:1.25}
.ht small{display:block;color:var(--muted);font-size:.88rem}
.hreset{text-align:center;color:var(--muted);font-weight:700;margin:22px 0 4px;font-size:.95rem}
.empty{text-align:center;color:var(--muted);margin-top:40px;font-size:1.1rem}

.eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.eye+.eye{animation-delay:.02s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:45}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* ===== Full-screen moments ===== */
.fx{position:fixed;inset:0;z-index:40;overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));animation:fadein .25s ease;text-align:center}
.fx-in{position:relative;z-index:2;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
.fx h2{margin:6px 0 4px;font-size:clamp(2.1rem,10vw,2.8rem);line-height:1.05;font-weight:700;color:#fff;--o:#1B1F3B;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 6px 0 var(--o)}
.fx h2 .w{display:inline-block;white-space:nowrap}
.fx h2 .l{display:inline-block;animation:letter .6s cubic-bezier(.2,1.8,.4,1) both}
@keyframes letter{from{transform:translateY(40px) scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.fx .fx-r{margin:6px 0 0;font-size:1.3rem;font-weight:700;color:#fff;background:rgba(27,31,59,.55);border-radius:999px;padding:4px 16px;animation:popin .4s cubic-bezier(.2,1.4,.4,1) .9s both}
.fx-count{display:flex;align-items:center;gap:10px;margin:18px 0 6px;position:relative}
.fx-count .mini{width:54px;height:54px;flex:none}
.fx-count b{font-size:4rem;font-weight:700;line-height:1;color:#FFD23F;min-width:1.4em;--o:#1B1F3B;
  text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 6px 0 var(--o)}
.fx-count b.bumped{animation:bump .55s cubic-bezier(.2,1.8,.4,1)}
.fx-next{width:100%;color:#fff;font-weight:700;font-size:1.05rem;line-height:1.35;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.fx-next .pbar{margin:8px 0 6px}
.fx .go{margin-top:20px;font-size:1.5rem;background:#fff;color:#1B1F3B;animation:popin .4s cubic-bezier(.2,1.4,.4,1) 1.4s both}
.mascot{width:min(52vw,210px);position:relative}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}

/* gained */
.fx-gain{background:radial-gradient(circle at 50% 38%,#FFE36E 0%,#FFB627 38%,#FF7A1A 72%,#E8501A 100%)}
.rays{position:absolute;left:50%;top:38%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;z-index:0;
  background:repeating-conic-gradient(rgba(255,255,255,.28) 0 9deg,transparent 9deg 22.5deg);
  animation:spin 26s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-gain .mascot{animation:starin 1s cubic-bezier(.2,1.5,.4,1) both}
.fx-gain .mascot svg{animation:joy 1.6s ease-in-out 1s infinite}
@keyframes starin{0%{transform:scale(.05) rotate(-540deg);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes joy{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-6deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-8px) rotate(6deg)}}
.spark{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;z-index:-1;animation:spark 1.5s cubic-bezier(.15,.7,.3,1) .5s both}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}8%{opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(var(--s)) rotate(200deg);opacity:0}}
.fly{position:fixed;z-index:3;width:44px;height:44px;pointer-events:none}

/* lost */
.fx-lose{background:linear-gradient(180deg,#6F7FB0 0%,#4B5891 55%,#323C6E 100%)}
.cloud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 2%);left:50%;width:min(80vw,330px);margin-left:calc(min(80vw,330px) / -2);z-index:1;animation:cloudin .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes cloudin{from{transform:translateY(-140%)}to{transform:none}}
.cloud svg{display:block;width:100%;height:auto;animation:drift 4s ease-in-out .8s infinite}
@keyframes drift{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.drop{position:absolute;top:70%;width:8px;height:16px;background:#9CC8FF;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid #1B1F3B;opacity:0;animation:rain 1.1s linear infinite}
@keyframes rain{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(42vh);opacity:0}}
.fx-lose .mascot{animation:sadin 1.1s cubic-bezier(.3,1.2,.5,1) both}
.fx-lose .mascot svg{animation:sigh 3s ease-in-out 1.1s infinite;transform-origin:50% 90%}
@keyframes sadin{0%{transform:translateY(-70vh) rotate(25deg)}60%{transform:translateY(0) scale(1.15,.82)}78%{transform:translateY(-12px) scale(.95,1.06)}100%{transform:none}}
@keyframes sigh{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(4px) scaleY(.97)}}
.tear{animation:tear 1.8s ease-in 1.2s infinite;transform-box:fill-box;transform-origin:top}
@keyframes tear{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(46px) scale(1);opacity:0}}
.fx-lose h2{color:#CFE0FF}
.fx-lose .fx-count b{color:#FFD23F}
.fx-lose .fx-count b.shake{animation:shake .5s ease}
.tumble{position:absolute;left:0;top:0;width:54px;height:54px;animation:tumble 1.3s cubic-bezier(.5,0,.8,.6) .9s both}
@keyframes tumble{0%{transform:none;opacity:1}20%{transform:translate(-14px,-30px) rotate(-30deg)}100%{transform:translate(-50px,60vh) rotate(-300deg) scale(.6);opacity:.2}}
.fx-enc{margin:12px 0 0;color:#fff;font-size:1.25rem;font-weight:700;animation:popin .4s cubic-bezier(.2,1.4,.4,1) 1.6s both}
.fx-lose .go{background:#CFE0FF}

/* reward */
.fx-rew{background:radial-gradient(circle at 50% 40%,#FF8FD0 0%,#C04BE0 45%,#5B21B6 100%)}
.fx-rew .rays{opacity:0;animation:spin 26s linear infinite,fadein .4s ease 1.3s forwards}
.gift{width:min(56vw,220px);position:relative;height:min(56vw,220px)}
.gift svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gift .box{animation:giftshake 1.25s ease both;transform-origin:50% 100%}
@keyframes giftshake{0%,100%{transform:none}10%,30%,50%,70%{transform:rotate(-8deg) scale(1.02)}20%,40%,60%,80%{transform:rotate(8deg) scale(1.02)}90%{transform:scale(1.1,.9)}}
.gift .lid{animation:lid .7s cubic-bezier(.2,.8,.4,1) 1.25s both;transform-box:fill-box;transform-origin:center}
@keyframes lid{to{transform:translate(70px,-150px) rotate(50deg);opacity:0}}
.prize{position:absolute;left:50%;top:44%;font-size:min(30vw,120px);line-height:1;transform:translate(-50%,-50%) scale(0);animation:prize .8s cubic-bezier(.2,1.6,.4,1) 1.3s forwards;z-index:2;filter:drop-shadow(0 6px 0 rgba(27,31,59,.35))}
@keyframes prize{0%{transform:translate(-50%,10%) scale(0)}100%{transform:translate(-50%,-80%) scale(1)}}
.fx-rew .fx-late{animation:popin .45s cubic-bezier(.2,1.4,.4,1) 1.5s both}
.fx-rew .go{animation-delay:2.2s}
.fx-rew .fx-r{animation-delay:1.8s;font-size:1.4rem}

@media (prefers-reduced-motion:reduce){
  .rays,.cm,.lg-m,.lg-m2,.lg-bg .tw,.fx-gain .mascot svg,.fx-lose .mascot svg,.cloud svg,.rcard.ready{animation:none!important}
  .confetti,.drop,.spark{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- Defaults ----------
const DEF_SET={
  milestones:[
    {id:"m1",n:5,name:"A small treat",emo:"🍦"},
    {id:"m2",n:10,name:"Extra bedtime story",emo:"📚"},
    {id:"m3",n:15,name:"Movie night",emo:"🎬"},
    {id:"m4",n:25,name:"Pick a new toy",emo:"🧸"}
  ],
  good:[["👂","Good listening"],["💛","Being kind"],["🧹","Tidying up"],["🍽️","Eating dinner"],["💪","Being brave"],["🙏","Good manners"]],
  bad:[["🙉","Not listening"],["😠","Being unkind"],["✋","Hitting or throwing"],["📢","Shouting"],["🛏️","Bedtime battle"],["🙅","Saying no"]],
  gate:false, at:0
};
const REW_EMO=["🍦","🍭","🍫","🧁","🍕","🍿","📚","🎬","🎮","🧸","🚗","🦖","⚽","🎨","🛝","🏊","🎡","🎢","🎁","🎈","🪁","🛹","🚲","🧩","🏰","🌳","🐶","🦄","🚀","⭐"];
const REA_EMO=["👂","💛","🧹","🍽️","💪","🙏","🦷","🛁","👕","📖","🤝","😊","🎒","🚽","🌟","🙉","😠","✋","📢","🛏️","🙅","😤","💥","🏃","📱"];

// ---------- Storage ----------
const KEY="dylan-stars-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==="object"?v:{}}catch(e){return {}}}
const S=load();
S.ev=S.ev||[]; S.deleted=S.deleted||{}; S.resetAt=S.resetAt||0; S.given=S.given||{};
S.set=S.set||clone(DEF_SET); if(S.sfx===undefined) S.sfx=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} syncUrl()}
// Home-screen apps on iPhone don't share storage with Safari, so the family code rides in the
// page address. Add to Home Screen saves that address, and the app links itself on first open.
const IS_APP=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
function syncUrl(){
  if(IS_APP) return;
  try{const want=location.pathname+(S.family?"?family="+S.family+(S.who?"&who="+encodeURIComponent(S.who):""):"");
    if(location.pathname+location.search!==want) history.replaceState(null,"",want)}catch(e){}
}
function touchSet(){S.set.at=Date.now(); save(); queueSync()}

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
function genId(){const a=new Uint32Array(3);crypto.getRandomValues(a);return [...a].map(n=>n.toString(36)).join("")}
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function dayLabel(t){
  const d=dayStart(t), today=dayStart(Date.now());
  if(d===today) return "Today"; if(d===today-864e5) return "Yesterday";
  return new Date(t).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
const timeLabel=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit",hour12:true}).replace(" ","");
function letters(str,base){
  let i=0;
  return str.split(" ").map(w=>`<span class="w">${[...w].map(c=>`<span class="l" style="animation-delay:${(base+(i++)*.045).toFixed(2)}s;--i:${i}">${esc(c)}</span>`).join("")}</span>`).join(" ");
}

// ---------- Stars maths ----------
function live(){return S.ev.filter(e=>!S.deleted[e.id])}
function chart(){
  const evs=live().filter(e=>e.t>=S.resetAt).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));
  let c=0,max=0; for(const e of evs){c=Math.max(0,c+e.d); if(c>max) max=c}
  return {count:c,max};
}
const ms=()=>[...S.set.milestones].sort((a,b)=>a.n-b.n);
const gkey=m=>S.resetAt+":"+m.id;
const isGiven=m=>{const g=S.given[gkey(m)];return !!(g&&g.on)};
function status(m,ch){return ch.max>=m.n?(isGiven(m)?"given":"ready"):"todo"}
const nextM=ch=>ms().find(m=>ch.max<m.n);
function addStar(d,reason){
  const before=chart();
  const e={id:genId(),t:Date.now(),d,r:reason||"",by:S.who||""};
  S.ev.push(e); save(); queueSync();
  const after=chart();
  return {e,before,after,newly:ms().filter(m=>after.max>=m.n&&before.max<m.n)};
}

// ---------- Artwork ----------
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?r:R;p.push((cx+k*Math.cos(a)).toFixed(1)+","+(cy+k*Math.sin(a)).toFixed(1))}return p.join(" ")}
const SP=starPts(100,108,84,46);
const starBody=(fill="#FFC21A")=>`<polygon points="${SP}" fill="${fill}" stroke="#1B1F3B" stroke-width="22" stroke-linejoin="round"/>
<polygon points="${SP}" fill="${fill}" stroke="${fill}" stroke-width="10" stroke-linejoin="round"/>
<ellipse cx="95" cy="50" rx="6" ry="13" fill="#fff" opacity=".75" transform="rotate(14 95 50)"/>`;
const EYES=(dy=0)=>[80,120].map(x=>`<g class="eye"><ellipse cx="${x}" cy="100" rx="10.5" ry="12.5" fill="#fff" stroke="#1B1F3B" stroke-width="3"/><circle cx="${x+2}" cy="${102+dy}" r="6.2" fill="#1B1F3B"/><circle cx="${x+4.5}" cy="${98.5+dy}" r="2.3" fill="#fff"/></g>`).join("");
function starSVG(mood){
  const face=mood==="sad"
    ?`${EYES(4)}<path d="M68 88 L90 80 M132 88 L110 80" stroke="#1B1F3B" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="66" cy="121" rx="8" ry="5" fill="#FF8FB8" opacity=".6"/><ellipse cx="134" cy="121" rx="8" ry="5" fill="#FF8FB8" opacity=".6"/>
      <path d="M86 131 Q100 118 114 131" stroke="#1B1F3B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path class="tear" d="M70 112 q-7 10 0 14 q7 -4 0 -14z" fill="#7CC4FF" stroke="#1B1F3B" stroke-width="2"/>`
    :`${EYES(0)}<ellipse cx="66" cy="120" rx="8.5" ry="5.5" fill="#FF8FB8"/><ellipse cx="134" cy="120" rx="8.5" ry="5.5" fill="#FF8FB8"/>
      <path d="M83 117 Q100 143 117 117 Z" fill="#7A1F2B" stroke="#1B1F3B" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M91 127 Q100 135 109 127 Q100 121 91 127Z" fill="#FF6B8A"/>`;
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${starBody()}${face}</svg>`;
}
const miniStar=(cls="mini")=>`<svg class="${cls}" viewBox="0 0 200 200" aria-hidden="true">${starBody()}</svg>`;
const sparkStar=(c)=>`<svg viewBox="0 0 200 200"><polygon points="${SP}" fill="${c}" stroke="#1B1F3B" stroke-width="16" stroke-linejoin="round"/></svg>`;

const LGPAL=["#FFD23F","#FF8A00","#FF5FAE","#4ADE80","#5CC8FF","#C4F25E"];
function logoHTML(){
  const rays=Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180,b=(i*30+12)*Math.PI/180;
    return `<path d="M200 92 L${(200+500*Math.cos(a)).toFixed(0)} ${(92+500*Math.sin(a)).toFixed(0)} L${(200+500*Math.cos(b)).toFixed(0)} ${(92+500*Math.sin(b)).toFixed(0)}Z" fill="#FFD23F" opacity=".13"/>`}).join("");
  const dots=[[30,24,3],[78,40,2],[120,16,2.5],[300,22,2],[352,52,3],[372,120,2],[262,160,2.5],[150,168,2],[44,96,2],[330,170,2.2],[210,14,1.8],[100,130,1.8]]
    .map(([x,y,r],i)=>`<g class="tw" style="animation-delay:${(i*.37).toFixed(2)}s"><path d="M${x} ${y-r*2.6} Q${x} ${y} ${x+r*2.6} ${y} Q${x} ${y} ${x} ${y+r*2.6} Q${x} ${y} ${x-r*2.6} ${y} Q${x} ${y} ${x} ${y-r*2.6}Z" fill="${i%3?"#fff":"#FFE36E"}"/></g>`).join("");
  return `<div class="logo" role="img" aria-label="Dylan's Stars">
  <svg class="lg-bg" viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><radialGradient id="lgg" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="#5B86FF"/><stop offset=".6" stop-color="#2440B8"/><stop offset="1" stop-color="#141C66"/></radialGradient></defs>
    <rect width="400" height="190" fill="url(#lgg)"/>${rays}${dots}</svg>
  <div class="lg-m">${starSVG("happy")}</div>
  <div class="lg-m2">${miniStar("")}</div>
  <div class="lg-txt"><div class="lg-dy">${[..."Dylan's"].map((c,i)=>`<span style="color:${LGPAL[i%LGPAL.length]}">${c}</span>`).join("")}</div>
  <div class="lg-st">${[..."STARS"].map((c,i)=>`<span style="color:${LGPAL[(i+2)%LGPAL.length]}">${c}</span>`).join("")}</div>
  <div class="lg-pr">Reward chart</div></div></div>`;
}
const GIFT=`<svg viewBox="0 0 200 200" aria-hidden="true"><g class="box">
  <rect x="32" y="98" width="136" height="92" rx="10" fill="#FF3D9A" stroke="#1B1F3B" stroke-width="5"/>
  <rect x="88" y="98" width="24" height="92" fill="#FFD23F" stroke="#1B1F3B" stroke-width="4"/>
  <rect x="40" y="106" width="10" height="70" rx="5" fill="#fff" opacity=".35"/>
  <g class="lid">
    <path d="M80 72 C58 40 34 52 50 68 C58 76 72 74 80 72Z" fill="#FFD23F" stroke="#1B1F3B" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M120 72 C142 40 166 52 150 68 C142 76 128 74 120 72Z" fill="#FFD23F" stroke="#1B1F3B" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="22" y="70" width="156" height="34" rx="9" fill="#FF6FB5" stroke="#1B1F3B" stroke-width="5"/>
    <rect x="86" y="70" width="28" height="34" fill="#FFD23F" stroke="#1B1F3B" stroke-width="4"/>
    <circle cx="100" cy="70" r="11" fill="#FFB800" stroke="#1B1F3B" stroke-width="4.5"/>
  </g></g></svg>`;
const CLOUD=`<svg viewBox="0 0 300 140" aria-hidden="true"><path d="M60 118 C22 118 14 78 44 68 C40 34 84 20 104 42 C116 10 176 6 190 40 C214 22 256 34 252 66 C286 70 288 118 248 118 Z" fill="#E4EBFF" stroke="#1B1F3B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M110 84 q8 6 16 0 M174 84 q8 6 16 0" stroke="#1B1F3B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M138 104 q12 -8 24 0" stroke="#1B1F3B" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>`;

// ---------- Sound effects (synthesised, no files) ----------
let AC=null, AC_BORN=0;
function newContext(){
  try{if(navigator.audioSession) navigator.audioSession.type="playback"}catch(e){}
  let c; try{c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  try{const buf=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=buf;src.connect(c.destination);src.start(0)}catch(e){}
  return c;
}
function ac(){
  if(!S.sfx) return null;
  // iOS can silently fail to resume audio after backgrounding, so swap in a fresh context on tap
  if(AC&&AC.state!=="running"&&Date.now()-AC_BORN<1500){try{AC.resume()}catch(e){};return AC}
  if(!AC||AC.state!=="running"){const old=AC; AC=newContext(); AC_BORN=Date.now(); if(old&&old.state!=="closed"){try{old.close()}catch(e){}}}
  return AC;
}
function voice(f,at,dur,o={}){
  const c=ac(); if(!c) return;
  const t=c.currentTime+at, osc=c.createOscillator(), g=c.createGain(), vol=o.vol||.15, att=o.att||.012;
  osc.type=o.type||"sine"; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  let node=osc;
  if(o.lp){const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.setValueAtTime(o.lp,t);fl.Q.value=o.q||1;
    if(o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur*.6); osc.connect(fl);node=fl}
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||5;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.05)}
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att);
  if(o.hold) g.gain.setValueAtTime(vol,t+Math.max(att,dur*o.hold));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  node.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+dur+.05);
}
const sparkle=(at,n)=>{for(let i=0;i<n;i++) voice(2400+Math.random()*1800,at+i*.07,.16,{vol:.045})};
const SFX={
  tap:()=>voice(660,0,.06,{type:"triangle",vol:.07}),
  gain:()=>{
    voice(260,0,.5,{to:1500,vol:.05});
    [784,988,1175,1568].forEach((f,i)=>voice(f,.5+i*.07,.22,{type:"triangle",vol:.15}));
    voice(2093,.78,.8,{vol:.16}); voice(1568,.8,.7,{type:"triangle",vol:.06}); sparkle(.9,6);
  },
  tick:()=>{voice(1319,0,.1,{type:"square",vol:.05,lp:3200});voice(1760,.06,.16,{type:"square",vol:.05,lp:3200})},
  lose:()=>{
    voice(900,0,.55,{to:180,vol:.05});
    voice(120,.62,.3,{to:55,vol:.28});
    // sad trombone: wah wah wah waaah
    [[196,.95,.36],[185,1.33,.36],[175,1.71,.36],[165,2.09,1.3]].forEach(([f,at,d],i)=>
      voice(f,at,d,{type:"sawtooth",vol:.11,lp:500,lpTo:1400,q:4,att:.04,hold:.55,vib:i===3?6:0,vd:4}));
  },
  drum:()=>{for(let i=0;i<20;i++) voice(150+Math.random()*60,i*.06,.05,{type:"triangle",vol:.07+i*.004})},
  fanfare:()=>{
    voice(500,0,.12,{to:1600,vol:.08});
    [523,659,784].forEach((f,i)=>voice(f,.06+i*.11,.12,{type:"square",vol:.06,lp:2600}));
    voice(1047,.4,1,{type:"square",vol:.07,lp:2600,hold:.5,vib:5,vd:6});
    [523,659,784].forEach(f=>voice(f,.4,1.1,{type:"triangle",vol:.07,hold:.4}));
    sparkle(.55,8);
  },
  given:()=>[659,784,1047].forEach((f,i)=>voice(f,i*.08,.25,{type:"triangle",vol:.12}))
};
function unlockAudio(){if(S.sfx) ac()}
document.addEventListener("touchend",unlockAudio,{passive:true});
document.addEventListener("click",unlockAudio);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&AC){try{AC.suspend()}catch(e){}}});

// ---------- No zooming ----------
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1) e.preventDefault()},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input")) e.preventDefault()});

function confetti(){
  const box=document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  const cols=["#FF3D9A","#FF8A00","#FFD23F","#16A34A","#2F6BFF","#7C3AED","#0EA5A4","#FFFFFF"];
  for(let i=0;i<60;i++){
    const c=document.createElement("i");
    c.style.left=Math.random()*100+"%"; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.8+Math.random()*1.6)+"s"; c.style.animationDelay=(Math.random()*.5)+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`; box.appendChild(c);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4200);
}

// ---------- Popups ----------
function dropToast(){document.querySelectorAll(".toast").forEach(x=>x.remove())}
function popup(html,cls){
  dropToast();
  const bg=document.createElement("div"); bg.className="pop-bg"+(cls?" "+cls:"");
  bg.innerHTML=html; document.body.appendChild(bg); return bg;
}
// Grown-up check (same as Phonics)
function gate(onPass){
  let a,b,ans,val="";
  const bg=document.createElement("div"); bg.className="pop-bg";
  const newQ=()=>{a=3+Math.floor(Math.random()*7); b=3+Math.floor(Math.random()*7); ans=a*b};
  const draw=()=>{
    bg.innerHTML=`<div class="pop gate" role="dialog" aria-modal="true" aria-label="Grown-ups only">
      <div class="pk">Grown-ups only</div><h2>What is ${a} × ${b}?</h2>
      <div class="disp" aria-live="polite">${val||"&nbsp;"}</div>
      <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button></div>
      <button class="link" data-k="cancel" style="margin-top:12px">Cancel</button></div>`;
    bg.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{
      const k=x.dataset.k;
      if(k==="cancel"){bg.remove();return}
      if(k==="del") val=val.slice(0,-1);
      else if(k==="ok"){
        if(+val===ans){bg.remove();onPass();return}
        val=""; newQ(); draw(); bg.querySelector(".gate").classList.add("shake"); return;
      } else if(val.length<3) val+=k;
      bg.querySelector(".disp").innerHTML=val||"&nbsp;";
    });
  };
  newQ(); draw(); document.body.appendChild(bg);
}

// Drag-to-reorder for reason lists (pointer events work for touch and mouse)
function dragList(list){
  const k=list.dataset.k;
  list.querySelectorAll(".handle").forEach(hd=>hd.onpointerdown=e=>{
    if(e.button>0) return;
    e.preventDefault();
    const row=hd.closest(".row"), y0=e.clientY, top0=row.getBoundingClientRect().top;
    let cur=0;
    if(document.activeElement) document.activeElement.blur();
    row.classList.add("dragging");
    const move=ev=>{
      if(ev.pointerId!==e.pointerId) return;
      ev.preventDefault();
      const y=ev.clientY, others=[...list.children].filter(r=>r!==row);
      let idx=others.filter(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2<y}).length;
      const now=[...list.children].indexOf(row);
      const target=idx<others.length?others[idx]:null;
      if((target?[...list.children].indexOf(target)-1:list.children.length-1)!==now){
        if(target) list.insertBefore(row,target); else list.appendChild(row);
      }
      const natural=row.getBoundingClientRect().top-cur;
      cur=top0+(y-y0)-natural; row.style.transform=`translateY(${cur}px)`;
    };
    const end=ev=>{
      if(ev.pointerId!==e.pointerId) return;
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",end); window.removeEventListener("pointercancel",end);
      row.classList.remove("dragging"); row.style.transform="";
      const order=[...list.children].map(r=>+r.dataset.i);
      if(order.some((v,i)=>v!==i)){const old=S.set[k]; S.set[k]=order.map(i=>old[i]); touchSet(); SFX.tap()}
      grown(1);
    };
    // listen on window: moving the row in the page would otherwise drop the pointer
    window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end);
  });
}

    const m=M(b.dataset.md); if(!confirm(`Remove "${m.name}"?`)) return;

  });
  $("#addm").onclick=()=>{
    const top=list.length?list[list.length-1].n:0;
    S.set.milestones.push({id:genId(),n:top+5,name:"New reward",emo:"🎁"}); touchSet(); grown(1);
    const ins=app.querySelectorAll("[data-mt]"); const last=ins[ins.length-1]; if(last){last.focus();last.select()}
  };
  const RI=s=>{const [k,i]=s.split(":");return [k,+i]};
  app.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>emojiPicker(REA_EMO,e=>{const [k,i]=RI(b.dataset.re);S.set[k][i][0]=e;touchSet();b.textContent=e}));
  app.querySelectorAll("[data-rt]").forEach(inp=>inp.oninput=()=>{const [k,i]=RI(inp.dataset.rt);S.set[k][i][1]=inp.value.trim()||"Reason";touchSet()});
  app.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{const [k,i]=RI(b.dataset.rd);S.set[k].splice(i,1);touchSet();grown(1)});
  app.querySelectorAll("[data-ra]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.ra; S.set[k].push([k==="good"?"🌟":"🙉",""]); touchSet(); grown(1);
    const ins=app.querySelectorAll(`[data-rt^="${k}:"]`); const last=ins[ins.length-1]; if(last) last.focus();
  });
  $("#tgate").onclick=()=>{S.set.gate=!S.set.gate;touchSet();$("#tgate").setAttribute("aria-checked",S.set.gate)};
  $("#tsfx").onclick=()=>{S.sfx=!S.sfx;save();const b=$("#tsfx");b.setAttribute("aria-checked",S.sfx);b.querySelector(".sw-ic").textContent=S.sfx?"🔊":"🔇";if(S.sfx)SFX.given()};
  $("#who").oninput=e=>{S.who=e.target.value.trim();S.whoAsked=1;save()};
  $("#fam").onclick=()=>{FAM_BACK=grown;familyScreen()};
  $("#reset").onclick=newChart;
  app.querySelectorAll(".rlist").forEach(dragList);
  if(!keep) window.scrollTo(0,0);
}

const SB_URL="https://auxgkypuiiqvujbacbvy.supabase.co";
const SB_KEY="sb_publishable_NmopGRSY8WU82P_ciex-_g_lO0aD2LQ";
const SYNC_KEYS=["ev","deleted","resetAt","given","set"];
const SYNC={state:S.family?"idle":"off"};
let syncing=false, syncAgain=false, syncTimer=null, FAM_BACK=home;

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(fn+" "+r.status);
  const t=await r.text(); return t?JSON.parse(t):null;
}
function mergeData(L,R){
  const em={}; for(const e of [...(R.ev||[]),...(L.ev||[])]) if(e&&e.id) em[e.id]=e;
  const del={...(R.deleted||{})}; for(const k in (L.deleted||{})) del[k]=Math.max(del[k]||0,L.deleted[k]);
  const given={...(R.given||{})}; for(const k in (L.given||{})){const l=L.given[k]; if(!given[k]||(l.t||0)>(given[k].t||0)) given[k]=l}
  const ls=L.set||clone(DEF_SET), rs=R.set;
  const set=rs&&(rs.at||0)>(ls.at||0)?rs:ls;
  return {ev:Object.values(em).sort((a,b)=>a.t-b.t),deleted:del,resetAt:Math.max(L.resetAt||0,R.resetAt||0),given,set};
}
async function syncNow(){
  if(!S.family||!navigator.onLine){updSyncUI();return}
  if(syncing){syncAgain=true;return}
  syncing=true; SYNC.state="syncing"; updSyncUI();
  try{
    const remote=await rpc("get_stars",{p_code:S.family});
    const local={}; SYNC_KEYS.forEach(k=>local[k]=S[k]);
    const before=JSON.stringify(local), m=mergeData(local,remote||{});
    SYNC_KEYS.forEach(k=>S[k]=m[k]); S.lastSync=Date.now(); save();
    const changed=JSON.stringify(m)!==before;
    await rpc("save_stars",{p_code:S.family,p_data:m});
    SYNC.state="ok";
    const busy=document.querySelector(".fx,.pop-bg")||(document.activeElement&&document.activeElement.tagName==="INPUT");
    if(changed&&VIEW&&!busy) VIEW();
  }catch(e){SYNC.state="error"; SYNC.err=String(e&&e.message||e)}
  syncing=false; updSyncUI();
  if(syncAgain){syncAgain=false;syncNow()}
}
function queueSync(){if(!S.family)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1200)}
function pillText(){return !S.family?"Off":SYNC.state==="syncing"?"Syncing…":SYNC.state==="error"?"Not synced":"On"}
function lastSyncText(){
  if(SYNC.state==="error") return "Couldn't sync ("+(SYNC.err||"unknown")+"). Check your signal. If it keeps happening, the Supabase project may be paused.";
  if(!S.lastSync) return "Not synced yet";
  return "Last synced "+dayLabel(S.lastSync).replace("Today","today").replace("Yesterday","yesterday")+" at "+timeLabel(S.lastSync);
}
function syncShort(){return SYNC.state==="syncing"?"Syncing…":SYNC.state==="error"?"Not synced. Check Family sync in Grown-ups.":S.lastSync?"Synced "+timeLabel(S.lastSync):""}
function updSyncUI(){
  const pl=$("#syncpill"); if(pl){pl.textContent=pillText();pl.dataset.s=!S.family?"off":SYNC.state}
  const st=$("#syncstat"); if(st) st.textContent=SYNC.state==="syncing"?"Syncing…":lastSyncText();
  const sl=$("#syncline"); if(sl) sl.textContent=S.family?syncShort():"";
}
const CODE_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genCode(){const a=new Uint32Array(12);crypto.getRandomValues(a);return [...a].map(n=>CODE_ABC[n%CODE_ABC.length]).join("")}
const normCode=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmtCode=c=>c.match(/.{1,4}/g).join("-");
function joinLink(){return location.origin+location.pathname+"?join="+S.family}
let PENDING_JOIN=null;
(()=>{try{const q=new URLSearchParams(location.search);
  const j=q.get("join"); if(j) PENDING_JOIN=normCode(j);
  const f=normCode(q.get("family")||""), w=(q.get("who")||"").trim().slice(0,20);
  // Opened from a home-screen icon saved while linked: link this copy too (once, so "Stop syncing" sticks)
  if(f.length===12&&!S.family&&S.urlFamily!==f){
    S.family=f; S.urlFamily=f; SYNC.state="idle";
    if(w&&!S.who){S.who=w; S.whoAsked=1}
  }
  if(f.length===12) S.urlFamily=f;
  save();
}catch(e){}})();
function afterJoin(){
  PENDING_JOIN=null; FAM_BACK=home; save();
  syncNow().then(()=>{home(); const tip=()=>{if(!IS_APP) homeScreenTip()}; if(!S.whoAsked) askWho(tip); else tip()});
}

}
function familyScreen(){
  VIEW=familyScreen;
  if(!S.family&&PENDING_JOIN){
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Home</button></div>
    <h1 class="title">Join the family</h1>

        S.family=c; afterJoin();
      }catch(e){msg.style.color="";msg.textContent="Couldn't connect ("+String(e&&e.message||e)+"). Check the internet connection and try again.";$("#join1").disabled=false}
    };
  } else if(!S.family){
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Back</button></div>
    <h1 class="title">Family sync</h1>
    <p class="hint">Keep stars, rewards and history the same on both your phones.</p>
    <h3 class="ghead">First phone</h3>
    <button class="go" id="create">Start family sync</button>
    <h3 class="ghead">Already started on another phone?</h3>
    <input class="inp" id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button class="ghost" id="join" style="margin-top:12px">Join with this code</button>
    <div class="warn" id="fmsg" aria-live="polite"></div>`;
    $("#back").onclick=()=>FAM_BACK();

    $("#join").onclick=async()=>{
      const c=normCode($("#code").value), msg=$("#fmsg");
      if(c.length!==12){msg.textContent="Codes are 12 letters and numbers";return}
      msg.style.color="var(--muted)"; msg.textContent="Checking…";
      try{
        const r=await rpc("get_stars",{p_code:c});
        if(!r){msg.style.color="";msg.textContent="Code not found. Check it and try again.";return}
        S.family=c; PENDING_JOIN=null; save(); await syncNow(); familyScreen();
      }catch(e){msg.style.color="";msg.textContent="Couldn't connect ("+String(e&&e.message||e)+"). Check your signal and try again."}
    };
  } else {
    app.innerHTML=`
    <div class="bar"><button class="back" id="back">‹ Back</button></div>
    <h1 class="title">Family sync</h1>
    <p class="hint">On. Share the link, or enter this code on another phone to link it.</p>
    ${PENDING_JOIN&&PENDING_JOIN!==S.family?`<p class="warn" style="text-align:left">That link is for a different family code. Tap "Stop syncing on this phone" first if you want to switch.</p>`:""}
    <div class="codebox">${fmtCode(S.family)}</div>
    <p class="hint" id="syncstat" style="text-align:center;margin-top:10px">${lastSyncText()}</p>
    <div class="stack" style="margin-top:20px">
      <button class="go" id="share">Share link</button>

      <button class="ghost" id="now">Sync now</button>
    </div>
    <div style="text-align:center;margin-top:24px"><button class="link" id="off">Stop syncing on this phone</button></div>`;
    $("#back").onclick=()=>{PENDING_JOIN=null;FAM_BACK()};
    $("#share").onclick=async()=>{
      const url=joinLink(), text="Tap to open Dylan's Stars and join our family sync (code "+fmtCode(S.family)+")";
      try{ if(navigator.share) await navigator.share({title:"Dylan's Stars",text,url}); else {await navigator.clipboard.writeText(url); $("#share").textContent="Link copied!"} }catch(e){}
    };
    $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(joinLink()); $("#copy").textContent="Copied!"}catch(e){}};
    $("#now").onclick=syncNow;
    $("#off").onclick=()=>{if(confirm("Stop syncing on this phone? Everything stays on this phone, it just stops sharing.")){S.family=null;SYNC.state="off";save();familyScreen()}};
  }
  window.scrollTo(0,0);
}
